<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nepali Games</title>
<style>
  :root {
    --felt: #0b5e35;
    --felt-dark: #073d22;
    --gold: #d4af37;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    color: #fff; min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    color: var(--gold); font-size: 26px; margin: 0 0 4px; letter-spacing: 1px;
  }
  header p { margin: 0; opacity: 0.7; font-size: 13px; }

  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.65;
    margin: 22px 0 10px 2px;
  }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }

  .tile {
    position: relative; border-radius: 16px; padding: 18px 14px; min-height: 118px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    overflow: hidden; cursor: pointer; transition: transform 0.12s;
  }
  .tile:active { transform: scale(0.96); }
  .tile.live {
    background: linear-gradient(145deg, rgba(212,175,55,0.18), rgba(255,255,255,0.06));
    border-color: rgba(212,175,55,0.5);
  }
  .tile-icon { font-size: 34px; line-height: 1; }
  .tile-name { font-weight: 700; font-size: 15px; margin-top: 8px; }
  .tile-sub { font-size: 11px; opacity: 0.65; margin-top: 2px; }
  .badge {
    position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 700;
    padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .badge.live { background: var(--gold); color: #2a2000; }
  .badge.soon { background: rgba(255,255,255,0.15); color: #ddd; }

  .tile.disabled { opacity: 0.55; cursor: default; }
  .tile.disabled:active { transform: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎴 Nepali Games</h1>
    <p>Call Break · Teen Patti · Marriage · Ludo · ra aru</p>
  </header>

  <div class="section-title">Card Games</div>
  <div class="grid" id="card-games"></div>

  <div class="section-title">Dice &amp; Board Games</div>
  <div class="grid" id="board-games"></div>

  <div class="section-title">Local Betting Games</div>
  <div class="grid" id="local-games"></div>
</div>

<script>
  const GAMES = {
    'card-games': [
      { icon: '♠️', name: 'Teen Patti', sub: 'Tin Patta', url: '/teenpatti.html', live: true },
      { icon: '📇', name: 'Call Break', sub: '4 khel', url: '/callbreak.html', live: true },
      { icon: '💍', name: 'Marriage', sub: '21 patta', url: null, live: false },
      { icon: '🃏', name: 'Rummy', sub: 'Sequence banau', url: null, live: false },
      { icon: '🀄', name: 'Kitti', sub: 'Trick-taking', url: null, live: false },
      { icon: '🎯', name: 'Daila Pakad', sub: 'Local variant', url: null, live: false },
      { icon: '🀫', name: 'Chungi Fras', sub: 'Local variant', url: null, live: false },
    ],
    'board-games': [
      { icon: '🎲', name: 'Ludo', sub: 'Dice + token', url: null, live: false },
    ],
    'local-games': [
      { icon: '🔔', name: 'Gurga', sub: 'Chidi-Itta-Pan-Hukum', url: null, live: false },
      { icon: '🎴', name: 'Andar Bahar', sub: 'Patti channe khel', url: null, live: false },
    ],
  };

  function render() {
    for (const [sectionId, games] of Object.entries(GAMES)) {
      const container = document.getElementById(sectionId);
      container.innerHTML = games.map(g => `
        <div class="tile ${g.live ? 'live' : 'disabled'}" ${g.live ? `onclick="location.href='${g.url}'"` : ''}>
          <span class="badge ${g.live ? 'live' : 'soon'}">${g.live ? 'Khelne' : 'Chaडै'}</span>
          <div class="tile-icon">${g.icon}</div>
          <div>
            <div class="tile-name">${g.name}</div>
            <div class="tile-sub">${g.sub}</div>
          </div>
        </div>
      `).join('');
    }
  }
  render();
</script>
</body>
</html>
