<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Call Break</title>
<style>
  :root { --felt:#0b5e35; --felt-dark:#073d22; --gold:#d4af37; --card-bg:#fffdf7; --card-red:#c0392b; --card-black:#1a1a1a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%); color:#fff; min-height:100vh; }
  .screen { padding:16px; max-width:480px; margin:0 auto; }
  .hidden { display:none !important; }
  a.back { color:var(--gold); text-decoration:none; font-size:14px; display:inline-block; margin-bottom:10px; }
  h1 { text-align:center; color:var(--gold); font-size:26px; margin:6px 0 20px; }
  input { width:100%; padding:14px; border-radius:10px; border:none; font-size:16px; margin-bottom:12px; background:rgba(255,255,255,0.95); color:#111; }
  button { width:100%; padding:14px; border-radius:10px; border:none; font-size:16px; font-weight:600; margin-bottom:10px; cursor:pointer; }
  button:disabled { opacity:0.35; }
  .btn-primary { background:var(--gold); color:#2a2000; }
  .btn-secondary { background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.3); }
  .err { color:#ffb3b3; text-align:center; margin-top:8px; }

  .table-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .code-badge { background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:20px; font-size:14px; letter-spacing:2px; }
  .round-badge { font-size:13px; opacity:0.8; }

  .score-table { width:100%; border-collapse:collapse; margin-bottom:14px; font-size:13px; }
  .score-table th, .score-table td { padding:6px 4px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.1); }
  .score-table th { opacity:0.7; font-weight:600; }
  .score-table td.me { color:var(--gold); font-weight:700; }

  .trick-area { display:flex; justify-content:center; gap:10px; min-height:90px; align-items:center; margin:14px 0; flex-wrap:wrap; }
  .trick-card { display:flex; flex-direction:column; align-items:center; }
  .trick-card .name { font-size:10px; opacity:0.7; margin-bottom:3px; }

  .card { width:44px; height:64px; border-radius:6px; background:var(--card-bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:15px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
  .card.red { color:var(--card-red); } .card.black { color:var(--card-black); }
  .card.playable { box-shadow:0 0 0 2px var(--gold), 0 2px 6px rgba(0,0,0,0.4); cursor:pointer; }
  .card.disabled { opacity:0.4; }

  .hand { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:14px 0; }

  .status-text { text-align:center; font-size:14px; opacity:0.85; margin-bottom:10px; }
  .bid-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:10px; }
  .bid-grid button { padding:10px 0; margin:0; font-size:14px; }

  .players-strip { display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; }
  .players-strip .p { text-align:center; opacity:0.75; }
  .players-strip .p.turn { opacity:1; color:var(--gold); font-weight:700; }

  .log-box { background:rgba(0,0,0,0.3); border-radius:10px; padding:10px; font-size:12px; max-height:90px; overflow-y:auto; margin-top:10px; opacity:0.85; }
  .result-banner { background:var(--gold); color:#2a2000; text-align:center; padding:14px; border-radius:12px; font-weight:700; margin-bottom:12px; }
</style>
</head>
<body>

<div id="join-screen" class="screen">
  <a href="/" class="back">&larr; Lobby ma pharkanuhos</a>
  <h1>📇 Call Break</h1>
  <input id="name-input" placeholder="Timro naam" maxlength="16" />
  <button class="btn-primary" onclick="createTable()">Naya Table Banau (4 players)</button>
  <div style="text-align:center; margin:10px 0; opacity:0.6;">— wa —</div>
  <input id="code-input" placeholder="Table code halnus" maxlength="6" style="text-transform:uppercase;" />
  <button class="btn-secondary" onclick="joinTable()">Table Join Garu</button>
  <div id="join-error" class="err"></div>
</div>

<div id="table-screen" class="screen hidden">
  <div class="table-header">
    <span class="code-badge" id="table-code-display"></span>
    <span class="round-badge" id="round-display"></span>
  </div>

  <div id="result-banner" class="result-banner hidden"></div>

  <table class="score-table" id="score-table"></table>

  <div class="players-strip" id="players-strip"></div>

  <div id="start-btn-wrap">
    <button class="btn-secondary" onclick="startRound()">Round Suru</button>
  </div>

  <div class="status-text" id="status-text"></div>

  <div id="bid-area"></div>

  <div class="trick-area" id="trick-area"></div>

  <div class="hand" id="my-hand"></div>

  <div class="log-box" id="log-box"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myId = null;
  let currentTableId = null;
  let myHand = [];

  socket.on('connect', () => { myId = socket.id; });

  function createTable() {
    const name = document.getElementById('name-input').value.trim() || 'Player';
    socket.emit('cbCreateTable', { name, totalRounds: 5 }, (res) => {
      if (!res.ok) return showErr(res.error);
      currentTableId = res.tableId;
      enterTable(res.state);
    });
  }

  function joinTable() {
    const name = document.getElementById('name-input').value.trim() || 'Player';
    const tableId = document.getElementById('code-input').value.trim().toUpperCase();
    if (!tableId) return showErr('Table code halnus');
    socket.emit('cbJoinTable', { tableId, name }, (res) => {
      if (!res.ok) return showErr(res.error);
      currentTableId = tableId;
      enterTable(res.state);
    });
  }

  function showErr(msg) { document.getElementById('join-error').innerText = msg || 'Error'; }

  function enterTable(state) {
    document.getElementById('join-screen').classList.add('hidden');
    document.getElementById('table-screen').classList.remove('hidden');
    document.getElementById('table-code-display').innerText = currentTableId;
    render(state);
  }

  function startRound() {
    socket.emit('cbStartRound', {}, (res) => { if (!res.ok) alert(res.error); });
  }

  function submitBid(n) {
    socket.emit('cbBid', { amount: n }, (res) => { if (!res.ok) alert(res.error); });
  }

  function playCard(card) {
    socket.emit('cbPlayCard', { card }, (res) => { if (!res.ok) alert(res.error); });
  }

  socket.on('cbState', (state) => {
    const me = state.players.find(p => p.id === myId);
    if (me && me.hand) myHand = me.hand;
    render(state);
  });

  const SUIT_SYMBOL = { S:'♠', H:'♥', D:'♦', C:'♣' };
  const SUIT_COLOR = { S:'black', H:'red', D:'red', C:'black' };
  function rankLabel(r){ if(r===14)return'A'; if(r===13)return'K'; if(r===12)return'Q'; if(r===11)return'J'; return String(r); }

  function render(state) {
    document.getElementById('round-display').innerText = state.roundNumber
      ? `Round ${state.roundNumber}/${state.totalRounds}` : 'Suru huna baँki';

    // score table
    const scoreTable = document.getElementById('score-table');
    if (state.players.length) {
      let html = '<tr><th>Player</th><th>Bid</th><th>Won</th><th>Total</th></tr>';
      state.players.forEach(p => {
        html += `<tr>
          <td class="${p.id===myId?'me':''}">${p.name}${p.id===state.dealerId?' 🎴':''}</td>
          <td>${p.bid ?? '-'}</td>
          <td>${p.tricksWon}</td>
          <td class="${p.id===myId?'me':''}">${p.totalScore}</td>
        </tr>`;
      });
      scoreTable.innerHTML = html;
    }

    // players turn strip
    const strip = document.getElementById('players-strip');
    strip.innerHTML = state.players.map(p => `
      <div class="p ${p.id===state.turnPlayerId?'turn':''}">
        ${p.name}${p.id===myId?' (Timi)':''}<br/>${p.cardCount} card
      </div>
    `).join('');

    document.getElementById('start-btn-wrap').classList.toggle('hidden',
      !(state.phase === 'round_end' || !state.roundNumber));
    const me = state.players.find(p => p.id === myId);
    const isTurn = state.turnPlayerId === myId;

    // status text
    let status = '';
    if (!state.roundNumber) status = '"Round Suru" thicnus (4 players chaहिन्छ)';
    else if (state.phase === 'bidding') status = isTurn ? 'Timro bid garne palo!' : 'Bid gardai...';
    else if (state.phase === 'playing') status = isTurn ? 'Timro card khelne palo!' : 'Arko ko palo...';
    else if (state.phase === 'round_end') status = 'Round sakiyo — arko round suru garnुs';
    else if (state.phase === 'game_end') status = '🏁 Game sakiyo!';
    document.getElementById('status-text').innerText = status;

    // bid area
    const bidArea = document.getElementById('bid-area');
    bidArea.innerHTML = '';
    if (state.phase === 'bidding' && isTurn) {
      const grid = document.createElement('div');
      grid.className = 'bid-grid';
      for (let n = 1; n <= 13; n++) {
        const b = document.createElement('button');
        b.className = 'btn-secondary';
        b.innerText = n;
        b.onclick = () => submitBid(n);
        grid.appendChild(b);
      }
      bidArea.appendChild(grid);
    }

    // trick area
    const trickArea = document.getElementById('trick-area');
    trickArea.innerHTML = (state.currentTrick || []).map(t => {
      const pl = state.players.find(p => p.id === t.playerId);
      const c = t.card;
      return `<div class="trick-card">
        <div class="name">${pl ? pl.name : ''}</div>
        <div class="card ${SUIT_COLOR[c.suit]}">${rankLabel(c.rank)}<span style="font-size:16px;">${SUIT_SYMBOL[c.suit]}</span></div>
      </div>`;
    }).join('');

    // my hand
    const handBox = document.getElementById('my-hand');
    handBox.innerHTML = '';
    if (me && myHand.length && (state.phase === 'playing' || state.phase === 'bidding')) {
      const ledSuit = state.ledSuit;
      const hasLed = ledSuit ? myHand.some(c => c.suit === ledSuit) : false;
      myHand.forEach(c => {
        const div = document.createElement('div');
        const legal = state.phase === 'playing' && isTurn &&
          (!ledSuit || (hasLed ? c.suit === ledSuit : true));
        div.className = 'card ' + SUIT_COLOR[c.suit] + (legal ? ' playable' : (state.phase==='playing' && isTurn ? ' disabled' : ''));
        div.innerHTML = `${rankLabel(c.rank)}<span style="font-size:16px;">${SUIT_SYMBOL[c.suit]}</span>`;
        if (legal) div.onclick = () => playCard(c);
        handBox.appendChild(div);
      });
    }

    // round end / game end banner
    const banner = document.getElementById('result-banner');
    if (state.phase === 'round_end' || state.phase === 'game_end') {
      const top = [...state.players].sort((a,b) => b.totalScore - a.totalScore)[0];
      banner.innerText = state.phase === 'game_end'
        ? `🏁 Game sakiyo! Agadi: ${top.name} (${top.totalScore})`
        : `Round ${state.roundNumber} sakiyo — Agadi: ${top.name} (${top.totalScore})`;
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
    }

    const logBox = document.getElementById('log-box');
    logBox.innerHTML = (state.log || []).map(l => `<div>${l}</div>`).join('');
    logBox.scrollTop = logBox.scrollHeight;
  }
</script>
</body>
</html>
