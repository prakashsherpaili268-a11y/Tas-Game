<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Teen Patti</title>
<style>
  :root {
    --felt: #0b5e35;
    --felt-dark: #073d22;
    --gold: #d4af37;
    --card-bg: #fffdf7;
    --card-red: #c0392b;
    --card-black: #1a1a1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column;
  }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 16px; max-width: 480px; margin: 0 auto; width: 100%; }
  h1 { text-align: center; color: var(--gold); font-size: 28px; margin: 12px 0 24px; letter-spacing: 1px; }
  .hidden { display: none !important; }

  input {
    width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px;
    margin-bottom: 12px; background: rgba(255,255,255,0.95); color: #111;
  }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 600;
    margin-bottom: 10px; cursor: pointer; transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--gold); color: #2a2000; }
  .btn-secondary { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .code-badge { background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; font-size: 14px; letter-spacing: 2px; }
  .pot-box { text-align: center; background: rgba(0,0,0,0.25); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .pot-amount { font-size: 32px; font-weight: 700; color: var(--gold); }
  .stake-info { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .players-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .player-row {
    display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 12px; border: 2px solid transparent;
  }
  .player-row.turn { border-color: var(--gold); background: rgba(212,175,55,0.15); }
  .player-row.packed { opacity: 0.4; }
  .player-name { font-weight: 600; }
  .player-status { font-size: 12px; opacity: 0.8; text-transform: uppercase; }
  .player-chips { color: var(--gold); font-weight: 600; }

  .my-cards { display: flex; justify-content: center; gap: 8px; margin: 16px 0; min-height: 90px; }
  .card {
    width: 56px; height: 80px; border-radius: 8px; background: var(--card-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  .card.back {
    background: repeating-linear-gradient(45deg, #2a2a72, #2a2a72 6px, #1b1b4d 6px, #1b1b4d 12px);
  }
  .card.red { color: var(--card-red); }
  .card.black { color: var(--card-black); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1 1 45%; }

  .log-box {
    background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; font-size: 12px;
    max-height: 100px; overflow-y: auto; margin-top: 14px; opacity: 0.85;
  }
  .log-box div { margin-bottom: 2px; }

  .result-banner {
    background: var(--gold); color: #2a2000; text-align: center; padding: 14px; border-radius: 12px;
    font-weight: 700; margin-bottom: 12px;
  }
  .status-text { text-align: center; font-size: 14px; opacity: 0.85; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="join-screen" class="screen">
  <a href="/" style="color:#d4af37; text-decoration:none; font-size:14px; margin-bottom:10px; display:inline-block;">&larr; Lobby ma pharkanuhos</a>
  <h1>♠ Teen Patti ♥</h1>
  <input id="name-input" placeholder="Timro naam" maxlength="16" />
  <input id="boot-input" placeholder="Boot amount (jastai 5)" type="number" value="5" />
  <button class="btn-primary" onclick="createTable()">Naya Table Banau</button>
  <div style="text-align:center; margin: 10px 0; opacity:0.6;">— wa —</div>
  <input id="code-input" placeholder="Table code halnus" maxlength="6" style="text-transform:uppercase;" />
  <button class="btn-secondary" onclick="joinTable()">Table Join Garu</button>
  <div id="join-error" style="color:#ffb3b3; text-align:center; margin-top:8px;"></div>
</div>

<div id="table-screen" class="screen hidden">
  <div class="table-header">
    <span class="code-badge" id="table-code-display"></span>
    <button class="btn-secondary" style="width:auto; padding:8px 14px; margin:0;" onclick="startRound()">Round Suru</button>
  </div>

  <div id="result-banner" class="result-banner hidden"></div>

  <div class="pot-box">
    <div class="pot-amount" id="pot-amount">0</div>
    <div style="font-size:12px; opacity:0.7;">POT</div>
    <div class="stake-info" id="stake-info"></div>
  </div>

  <div class="players-list" id="players-list"></div>

  <div class="status-text" id="status-text"></div>

  <div class="my-cards" id="my-cards"></div>

  <div class="actions" id="actions"></div>

  <div class="log-box" id="log-box"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myId = null;
  let currentTableId = null;
  let latestState = null;
  let mySeenHand = null;

  socket.on('connect', () => { myId = socket.id; });

  function createTable() {
    const name = document.getElementById('name-input').value.trim() || 'Player';
    const boot = parseInt(document.getElementById('boot-input').value) || 5;
    socket.emit('createTable', { name, boot }, (res) => {
      if (!res.ok) return showJoinError(res.error);
      currentTableId = res.tableId;
      enterTable(res.state);
    });
  }

  function joinTable() {
    const name = document.getElementById('name-input').value.trim() || 'Player';
    const tableId = document.getElementById('code-input').value.trim().toUpperCase();
    if (!tableId) return showJoinError('Table code halnus');
    socket.emit('joinTable', { tableId, name }, (res) => {
      if (!res.ok) return showJoinError(res.error);
      currentTableId = tableId;
      enterTable(res.state);
    });
  }

  function showJoinError(msg) {
    document.getElementById('join-error').innerText = msg || 'Error';
  }

  function enterTable(state) {
    document.getElementById('join-screen').classList.add('hidden');
    document.getElementById('table-screen').classList.remove('hidden');
    document.getElementById('table-code-display').innerText = currentTableId;
    render(state);
  }

  function startRound() {
    mySeenHand = null;
    socket.emit('startRound', {}, (res) => {
      if (!res.ok) alert(res.error);
    });
  }

  function act(action, payload = {}) {
    socket.emit(action, payload, (res) => {
      if (!res.ok) alert(res.error);
    });
  }

  function seeCards() {
    socket.emit('seeCards', {}, (res) => {
      if (res.ok && res.result && res.result.players) {
        const me = res.result.players.find(p => p.id === myId);
        if (me && me.hand) mySeenHand = me.hand;
      }
    });
  }

  socket.on('state', (state) => {
    latestState = state;
    const me = state.players.find(p => p.id === myId);
    if (me && me.hand) mySeenHand = me.hand;
    render(state);
  });

  socket.on('roundEnded', (result) => {
    const banner = document.getElementById('result-banner');
    banner.innerText = `🏆 ${result.winnerName} jitte! Pot: ${result.pot}`;
    banner.classList.remove('hidden');
    mySeenHand = null;
    setTimeout(() => banner.classList.add('hidden'), 6000);
  });

  const SUIT_SYMBOL = { S: '♠', H: '♥', D: '♦', C: '♣' };
  const SUIT_COLOR = { S: 'black', H: 'red', D: 'red', C: 'black' };
  function rankLabel(r) {
    if (r === 14) return 'A'; if (r === 13) return 'K'; if (r === 12) return 'Q'; if (r === 11) return 'J';
    return String(r);
  }

  function render(state) {
    document.getElementById('pot-amount').innerText = state.pot;
    const stakeText = `Blind: ${state.currentStake} · Seen: ${state.currentStake * 2}` +
      (state.ultraBlindActive ? ' · ⚡ Ulta Blind active' : '');
    document.getElementById('stake-info').innerText = stakeText;

    const list = document.getElementById('players-list');
    list.innerHTML = '';
    state.players.forEach(p => {
      const row = document.createElement('div');
      row.className = 'player-row' + (p.id === state.turnPlayerId ? ' turn' : '') + (p.status === 'packed' ? ' packed' : '');
      row.innerHTML = `
        <div>
          <div class="player-name">${p.name}${p.id === myId ? ' (Timi)' : ''}</div>
          <div class="player-status">${statusLabel(p.status)}${!p.connected ? ' · offline' : ''}</div>
        </div>
        <div class="player-chips">₹${p.chips}</div>
      `;
      list.appendChild(row);
    });

    const me = state.players.find(p => p.id === myId);
    const cardsBox = document.getElementById('my-cards');
    cardsBox.innerHTML = '';
    if (me && state.roundActive) {
      const revealed = me.status === 'seen' && mySeenHand;
      const hand = revealed ? mySeenHand : [null, null, null];
      hand.forEach(c => {
        const div = document.createElement('div');
        if (revealed && c) {
          div.className = 'card ' + SUIT_COLOR[c.suit];
          div.innerHTML = `${rankLabel(c.rank)}<span style="font-size:22px;">${SUIT_SYMBOL[c.suit]}</span>`;
        } else {
          div.className = 'card back';
        }
        cardsBox.appendChild(div);
      });
    }

    document.getElementById('status-text').innerText = state.roundActive
      ? (state.turnPlayerId === myId ? 'Timro palo ho!' : 'Aarko player ko palo...')
      : '"Round Suru" thicera naya round khelnus';

    renderActions(state, me);

    const logBox = document.getElementById('log-box');
    logBox.innerHTML = (state.log || []).map(l => `<div>${l}</div>`).join('');
    logBox.scrollTop = logBox.scrollHeight;
  }

  function statusLabel(s) {
    if (s === 'blind') return 'Blind';
    if (s === 'seen') return 'Seen';
    if (s === 'packed') return 'Packed';
    return s;
  }

  function renderActions(state, me) {
    const box = document.getElementById('actions');
    box.innerHTML = '';
    if (!me || !state.roundActive || me.status === 'packed') return;
    const isTurn = state.turnPlayerId === myId;

    const buttons = [];
    if (me.status === 'blind') {
      buttons.push(btn('Herchu (See)', () => seeCards(), false));
      buttons.push(btn(`Blind Chalu (₹${state.currentStake})`, () => act('playBlind'), !isTurn));
      if (state.ultraBlindEligiblePlayerId === myId) {
        buttons.push(btn(`⚡ Ulta Blind (₹${state.currentStake * 2})`, () => act('playUltraBlind'), !isTurn));
      }
    } else if (me.status === 'seen') {
      const seenCost = state.currentStake * 2;
      buttons.push(btn(`Chalu (₹${seenCost})`, () => act('playSeen'), !isTurn));
    }
    if (isTurn) {
      buttons.push(btn('Pack', () => act('pack'), false, 'btn-danger'));
    }
    if (state.canShow && isTurn) {
      buttons.push(btn('🎴 Show', () => act('show'), false, 'btn-primary'));
    }

    buttons.forEach(b => box.appendChild(b));
  }

  function btn(label, onclick, disabled, cls = 'btn-secondary') {
    const b = document.createElement('button');
    b.innerText = label;
    b.className = cls;
    b.disabled = disabled;
    b.onclick = onclick;
    return b;
  }
</script>
</body>
</html>
